plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

android {
    namespace 'com.phonebridge'
    compileSdk 34

    defaultConfig {
        applicationId "com.phonebridge"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "2.1.0"
    }

    def releaseStoreFilePath = System.getenv('PHONEBRIDGE_RELEASE_STORE_FILE') ?: project.findProperty('phonebridgeReleaseStoreFile')
    def releaseStorePassword = System.getenv('PHONEBRIDGE_RELEASE_STORE_PASSWORD') ?: project.findProperty('phonebridgeReleaseStorePassword')
    def releaseKeyAlias = System.getenv('PHONEBRIDGE_RELEASE_KEY_ALIAS') ?: project.findProperty('phonebridgeReleaseKeyAlias')
    def releaseKeyPassword = System.getenv('PHONEBRIDGE_RELEASE_KEY_PASSWORD') ?: project.findProperty('phonebridgeReleaseKeyPassword')
    def releaseSigningValues = [releaseStoreFilePath, releaseStorePassword, releaseKeyAlias, releaseKeyPassword]
    def releaseSigningConfigured = releaseSigningValues.every { value -> value != null && !value.toString().trim().isEmpty() }
    if (releaseSigningValues.any { value -> value != null && !value.toString().trim().isEmpty() } && !releaseSigningConfigured) {
        throw new GradleException('PHONEBRIDGE_RELEASE_* signing values must be provided together')
    }
    signingConfigs {
        release {
            if (releaseSigningConfigured) {
                storeFile file(releaseStoreFilePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseSigningConfigured) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    sourceSets {
        test {
            resources.srcDir "$rootDir/../protocol-fixtures"
        }
    }
}

dependencies {
    implementation 'com.alphacephei:vosk-android:0.3.47'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.4"
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
    kapt 'androidx.room:room-compiler:2.6.1'
    implementation "androidx.camera:camera-core:1.3.4"
    implementation "androidx.camera:camera-camera2:1.3.4"
    implementation "androidx.camera:camera-lifecycle:1.3.4"
    implementation "androidx.camera:camera-view:1.3.4"
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    testImplementation 'junit:junit:4.13.2'
}
