name: PhoneBridge CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        run: npm ci --prefix server
      - name: Node tests
        shell: bash
        run: node --test server/*.test.js
      - name: Secret scan
        shell: pwsh
        run: ./scripts/scan_secrets.ps1
      - name: Protocol compatibility
        shell: bash
        run: node --test server/workspace-timeline.test.js server/workspace-api.test.js
      - name: Workspace performance budget
        shell: pwsh
        run: ./scripts/bench_workspace.ps1
      - name: Android unit tests
        working-directory: android
        run: bash ./gradlew :app:testDebugUnitTest --no-daemon --console=plain
      - name: Android debug build
        working-directory: android
        run: bash ./gradlew :app:assembleDebug --no-daemon --console=plain
      - name: Release gate manifest
        shell: pwsh
        run: ./scripts/verify_release_gates.ps1 -ApkPath android/app/build/outputs/apk/debug/app-debug.apk -Channel internal-debug -AllowProtectedBranch -RequireClean -ManifestPath "$env:RUNNER_TEMP/phonebridge-release-manifest.json"
      - name: Upload debug APK and manifest
        uses: actions/upload-artifact@v4
        with:
          name: phonebridge-debug-${{ github.sha }}
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            ${{ runner.temp }}/phonebridge-release-manifest.json
      - name: Diff whitespace
        run: git diff --check
      - name: Release worktree clean
        shell: bash
        run: test -z "$(git status --porcelain)"
