name: PhoneBridge CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Install server dependencies
        run: npm ci --prefix server
      - name: Node tests
        shell: bash
        run: node --test $(find server -name '*.test.js' -print)
      - name: Workspace performance budget
        shell: pwsh
        run: ./scripts/bench_workspace.ps1
      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew
      - name: Android unit tests
        working-directory: android
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain
      - name: Android debug build
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain
      - name: Diff whitespace
        run: git diff --check
